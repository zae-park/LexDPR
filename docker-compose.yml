services:
  lexdpr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lexdpr-api:latest
    container_name: lexdpr-api
    ports:
      - "8009:8009"
    environment:
      - MODEL_PATH=/model
      - PORT=8009
      - DEVICE=cuda
    networks:
      - llm-network
    volumes:
      - /data/LexDPR/LexDPR/lex_dpr/models/default_model:/model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

networks:
  llm-network:
    external: true
